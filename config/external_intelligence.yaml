version: 1

http:
  timeout_seconds: 20
  max_bytes: 25000000
  user_agent: "Project-Germania-External-Intelligence/1.0 (+public-data; no-auth)"

cache:
  directory: data/cache/external_intelligence

output:
  path: reports/external_intelligence.json

kba:
  enabled: true
  source_name: Kraftfahrt-Bundesamt (KBA) FZ10
  source_page_url: https://www.kba.de/DE/Statistik/Fahrzeuge/Neuzulassungen/MonatlicheNeuzulassungen/monatl_neuzulassungen_node.html
  catalog_search_url_template: "https://www.govdata.de/ckan/api/3/action/package_search?q=FZ%2010%20Jahr%20{year}%20Neuzulassungen%20Personenkraftwagen&rows=5"
  download_url_template: "https://www.kba.de/SharedDocs/Downloads/DE/Statistik/Fahrzeuge/FZ/{year}_monatlich/FZ10/fz10_{year}_{month:02d}.xlsx?__blob=publicationFile"
  period_lag_months: 1
  ttl_seconds: 604800

news:
  max_items_per_source: 20
  sources:
    - source_id: acea_news
      source_name: European Automobile Manufacturers' Association (ACEA)
      page_url: https://www.acea.auto/news/
      country: EU
      ttl_seconds: 21600
    - source_id: vda_news
      source_name: German Association of the Automotive Industry (VDA)
      page_url: https://www.vda.de/en/press/press-releases
      feed_url: https://www.vda.de/.rest/pressreleases/v1?siteroot=/vda/en/
      country: DE
      ttl_seconds: 21600
    - source_id: german_transport_policy
      source_name: German Federal Ministry for Transport (BMV)
      page_url: https://www.bmv.de/Presse
      country: DE
      ttl_seconds: 21600

brand_news:
  sources:
    - source_id: volkswagen_official_news
      source_name: Volkswagen Newsroom
      brand: Volkswagen
      page_url: https://www.volkswagen-newsroom.com/en/press-releases
      country: DE
      ttl_seconds: 21600
    - source_id: bmw_official_news
      source_name: BMW Group PressClub Global
      brand: BMW
      page_url: https://www.press.bmwgroup.com/global/article/search/index.html
      country: DE
      ttl_seconds: 21600
    - source_id: mercedes_official_news
      source_name: Mercedes-Benz Media
      brand: Mercedes-Benz
      page_url: https://media.mercedes-benz.com/en/
      feed_url: https://api.media.mercedes-benz.com/en/jsonapi/search/full?entity=press_release&tags=&sort=display_date&order=DESC&per_page=50
      country: DE
      ttl_seconds: 21600
    - source_id: audi_official_news
      source_name: Audi MediaCenter
      brand: Audi
      page_url: https://www.audi.com/en/press-releases
      country: DE
      ttl_seconds: 21600
    - source_id: tesla_official_news
      source_name: Tesla Blog
      brand: Tesla
      page_url: https://www.tesla.com/blog
      country: US
      ttl_seconds: 21600
    - source_id: byd_official_news
      source_name: BYD Global News Center
      brand: BYD
      page_url: https://media.byd.com/eu/?lang=eng
      feed_url: https://media.byd.com/feed/
      country: CN
      ttl_seconds: 21600
    - source_id: skoda_official_news
      source_name: Škoda Storyboard
      brand: Škoda
      page_url: https://www.skoda-storyboard.com/en/press-releases/
      feed_url: https://www.skoda-storyboard.com/en/feed/
      country: CZ
      ttl_seconds: 21600
    - source_id: mg_official_news
      source_name: MG Motor Europe Newsroom
      brand: MG
      page_url: https://news.mgmotor.eu/press/
      country: EU
      ttl_seconds: 21600
    - source_id: xpeng_official_news
      source_name: XPENG Pressroom
      brand: XPENG
      page_url: https://www.xpeng.com/pressroom/news
      country: GLOBAL
      ttl_seconds: 21600
    - source_id: nio_official_news
      source_name: NIO Newsroom
      brand: NIO
      page_url: https://www.nio.com/en_US/news
      country: GLOBAL
      ttl_seconds: 21600
