metadata:
  schema_version: 1
  description: Human-reviewed KBA source name mapping for Project Germania.
  source_file: data/raw/kba/fz10_2026_06.xlsx
  period: "2026-06"
  reviewed_phase: Phase 11C
  reviewed_at: "2026-07-18"
  derived_from:
    proposed_mapping: config/kba_name_mapping.proposed.yaml
    audit_report: reports/kba_matching_audit_2026_06.md
    vehicle_master: config/vehicles.yaml
  runtime_loaded: false
  notes:
    - This file records human-reviewed mapping decisions for observed KBA values.
    - Current runtime code does not load this file yet.
    - Unknown, missing, and ambiguous vehicles must be skipped, not guessed.

review_policy:
  brand_mapping:
    decision_rule: Approve exact, alias, and normalization matches to existing brand master data.
    unknown_brand_action: skip
    ambiguous_brand_action: skip
  vehicle_mapping:
    decision_rule: Approve only exact model matches against configured vehicle master data.
    unknown_vehicle_action: skip
    ambiguous_vehicle_action: skip
    missing_master_data_action: skip
    protect_against_false_friends:
      - Do not map BMW 1ER to BMW iX1.
      - Do not map BYD ATTO 2 to BYD Atto 3.
      - Do not map Tesla MODEL 3 to Tesla Model Y.
      - Do not map MG ROEWE compound brand values to MG automatically.

review_summary:
  parsed_records: 60
  approved_record_level_vehicle_mappings: 2
  deferred_missing_brand_records: 50
  rejected_missing_model_records: 7
  ambiguous_records: 1
  approved_brand_mappings: 9

