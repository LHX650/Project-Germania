rejected_vehicle_mappings:
  - source_brand: AUDI
    source_model: A1
    canonical_brand: Audi
    candidate_canonical_models:
      - Q4 e-tron
    decision: rejected
    reason: Observed KBA model is not a configured research vehicle for Audi.
  - source_brand: BMW
    source_model: 1ER
    canonical_brand: BMW
    candidate_canonical_models:
      - iX1
    decision: rejected
    reason: BMW 1ER is not BMW iX1.
  - source_brand: BYD
    source_model: ATTO 2
    canonical_brand: BYD
    candidate_canonical_models:
      - Atto 3
      - Seal U
    decision: rejected
    reason: BYD ATTO 2 is not BYD Atto 3 or BYD Seal U.
  - source_brand: LEAPMOTOR
    source_model: B05
    canonical_brand: Leapmotor
    candidate_canonical_models:
      - C10
    decision: rejected
    reason: Leapmotor B05 is not Leapmotor C10.
  - source_brand: MERCEDES
    source_model: A-KLASSE
    canonical_brand: Mercedes-Benz
    candidate_canonical_models:
      - EQA
    decision: rejected
    reason: Mercedes A-KLASSE is not Mercedes-Benz EQA.
  - source_brand: SKODA
    source_model: ELROQ
    canonical_brand: "\u0160koda"
    candidate_canonical_models:
      - Enyaq
    decision: rejected
    reason: Skoda ELROQ is not Skoda Enyaq.
  - source_brand: TESLA
    source_model: MODEL 3
    canonical_brand: Tesla
    candidate_canonical_models:
      - Model Y
    decision: rejected
    reason: Tesla MODEL 3 is not Tesla Model Y.

ambiguous_mappings:
  - source_brand: MG ROEWE
    source_model: "3"
    candidate_canonical_brand: MG
    candidate_canonical_models:
      - MG4
    decision: rejected
    reason: KBA compound brand contains both MG and ROEWE, so it cannot be mapped to MG automatically.

