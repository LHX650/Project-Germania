version: 1

defaults:
  recent_days: 30
  max_items_per_provider: 24
  cache_directory: data/cache/live_external_intelligence

http:
  timeout_seconds: 12
  max_bytes: 5000000
  user_agent: "Project-Germania-Live-Intelligence/2.0 (+public-data; no-auth)"

sources:
  - source_id: acea_automotive_news
    source_name: European Automobile Manufacturers' Association (ACEA)
    provider_kind: automotive_news
    transport: rss_or_html
    page_url: https://www.acea.auto/news/
    region: EU
    category: automotive_news
    evidence_type: official_industry_news
    reliability: 90
    ttl_seconds: 3600

  - source_id: vda_automotive_news
    source_name: German Association of the Automotive Industry (VDA)
    provider_kind: automotive_news
    transport: api
    page_url: https://www.vda.de/.rest/pressreleases/v1?siteroot=/vda/en/
    region: DE
    category: automotive_news
    evidence_type: official_industry_news
    reliability: 90
    ttl_seconds: 3600

  - source_id: eu_transport_policy
    source_name: European Commission Directorate-General for Mobility and Transport
    provider_kind: policy_regulation
    transport: rss_or_html
    page_url: https://transport.ec.europa.eu/news-events/news_en
    feed_url: https://transport.ec.europa.eu/node/2/rss_en
    region: EU
    category: policy_regulation
    evidence_type: official_policy_update
    reliability: 100
    ttl_seconds: 3600

  - source_id: german_transport_policy
    source_name: German Federal Ministry for Transport (BMV)
    provider_kind: policy_regulation
    transport: rss_or_html
    page_url: https://www.bmv.de/Presse
    region: DE
    category: policy_regulation
    evidence_type: official_policy_update
    reliability: 100
    ttl_seconds: 3600

  - source_id: volkswagen_official_news
    source_name: Volkswagen Newsroom
    provider_kind: official_brand_news
    transport: rss_or_html
    page_url: https://www.volkswagen-newsroom.com/en/press-releases
    brand: Volkswagen
    region: DE
    category: brand_intelligence
    evidence_type: official_brand_release
    reliability: 95
    ttl_seconds: 3600

