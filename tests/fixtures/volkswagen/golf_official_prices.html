<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <title>Volkswagen Golf Preise</title>
  </head>
  <body>
    <main>
      <article
        data-price-card
        data-price-type="official_starting_price"
        data-source-url="/de/modelle/golf.html"
      >
        <span data-field="brand">Volkswagen</span>
        <span data-field="model">Golf</span>
        <span data-field="variant">Life</span>
        <span data-field="price">ab 29.995,00 €</span>
        <span data-field="valid_date">2026-07-18</span>
        <span data-field="observed_at">2026-07-18T08:00:00+00:00</span>
        <span data-field="price_includes_vat">true</span>
        <a href="/de/modelle/golf.html">Golf Konfigurator</a>
      </article>

      <article
        data-price-card
        data-price-type="leasing_monthly_payment"
        data-source-url="/de/modelle/golf.html"
      >
        <span data-field="brand">Volkswagen</span>
        <span data-field="model">Golf</span>
        <span data-field="variant">Life</span>
        <span data-field="price">Leasing ab 199,00 € / Monat</span>
      </article>

      <article
        data-price-card
        data-price-type="finance_monthly_payment"
        data-source-url="/de/modelle/golf.html"
      >
        <span data-field="brand">Volkswagen</span>
        <span data-field="model">Golf</span>
        <span data-field="variant">Life</span>
        <span data-field="price">Finanzierung ab 299,00 € mtl.</span>
      </article>
    </main>
  </body>
</html>
