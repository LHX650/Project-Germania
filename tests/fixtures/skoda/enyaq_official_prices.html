<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <title>Skoda Enyaq Preise</title>
  </head>
  <body>
    <main>
      <article
        data-price-card
        data-price-type="official_starting_price"
        data-source-url="/modelle/enyaq/enyaq"
      >
        <h1>Skoda Enyaq</h1>
        <span data-field="brand">Skoda</span>
        <span data-field="model">Enyaq</span>
        <span data-field="variant">Enyaq 60</span>
        <span data-field="canonical_brand">Škoda</span>
        <span data-field="canonical_model">Enyaq</span>
        <strong data-field="price">ab 44.900,00 EUR</strong>
        <span data-field="valid_date">2026-07-18</span>
        <time data-field="observed_at" datetime="2026-07-18T08:00:00Z">
          2026-07-18T08:00:00+00:00
        </time>
        <span data-field="price_includes_vat">true</span>
      </article>

      <article data-price-card data-price-type="leasing_monthly_payment">
        <h2>PrivatLeasing</h2>
        <span data-field="brand">Skoda</span>
        <span data-field="model">Enyaq</span>
        <span data-field="variant">Enyaq 60</span>
        <strong data-field="price">389,00 EUR mtl.</strong>
      </article>

      <article data-price-card data-price-type="finance_monthly_payment">
        <h2>Finanzierung</h2>
        <span data-field="brand">Skoda</span>
        <span data-field="model">Enyaq</span>
        <span data-field="variant">Enyaq 60</span>
        <strong data-field="price">489,00 EUR mtl.</strong>
      </article>
    </main>
  </body>
</html>
